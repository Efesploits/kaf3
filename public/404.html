<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Kaf Tarım</title>
    <script>
      // GitHub Pages serves this file for any path it cannot resolve. Stash the
      // wanted route in a single encoded query parameter and bounce to the SPA
      // entry, which puts it back in the address bar before the router boots.
      //
      // SEGMENTS is how many leading path segments belong to the deployment
      // root: 1 for https://user.github.io/kaf3/, 0 for a custom domain.
      (function () {
        var SEGMENTS = 1
        var l = window.location
        var parts = l.pathname.split('/').filter(Boolean)
        var base = '/' + parts.slice(0, SEGMENTS).join('/') + (SEGMENTS ? '/' : '')
        var route = '/' + parts.slice(SEGMENTS).join('/')
        if (route === '/' && !l.search) {
          // Nothing to restore - redirecting again would loop.
          l.replace(l.origin + base)
          return
        }
        l.replace(
          l.origin + base + '?redirect=' + encodeURIComponent(route + l.search) + l.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
